<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKIPPER PANEL</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090611;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px 15px;
}

.container {
  max-width: 420px;
  margin: 35px auto;
  padding: 25px;
  background: #171023;
  border: 1px solid #934cff;
  border-radius: 20px;
  box-shadow: 0 0 25px #7b32ff55;
}

h1 { color: #bd83ff; font-size: 32px; }
p { color: #c8b6df; }

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  background: #873cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  border: 1px solid #9855ff;
  background: #241a33;
  color: white;
}

.hidden { display: none; }
small { color: #a995bc; }
</style>
</head>

<body>
<div class="container">

<h1>SKIPPER PANEL</h1>
<p>مرحبا بكم في SKIPPER PANEL</p>
<p>BIENVENIDO A SKIPPER PANEL</p>

<div id="follow">
<h3>PRIMERO SÍGUEME</h3>
<p>@skipper,911</p>

<button onclick="window.open('https://www.tiktok.com/@skipper,911','_blank')">
SEGUIR EN TIKTOK
</button>

<button onclick="showLogin()">
YA TE SIGO
</button>
</div>

<div id="login" class="hidden">
<h3>INICIAR SESIÓN</h3>
<input id="password" type="password"
placeholder="Introduce la contraseña">

<button onclick="enter()">ENTRAR</button>
<p id="message"></p>
</div>

<div id="panel" class="hidden">
<h2>BIENVENIDO SKIPPER</h2>
<p>SKIPPER PANEL OFFICIAL</p>
<p>Configuración y ajustes del juego</p>
</div>

<small>SKIPPER © 2026</small>
</div>

<script>
function showLogin() {
  document.getElementById('follow').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

function enter() {
  if (document.getElementById('password').value === '4444') {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
  } else {
    document.getElementById('message').innerText =
      'Contraseña incorrecta';
  }
}
</script>

</body>
</html>
